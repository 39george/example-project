worker_processes ${{num_workers}};
error_log stderr notice;
daemon off;
pid logs/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  # OpenResty/nginx directive, set searching paths for Lua-modules before Lua VM initialization
  # $prefix - OpenResty root dir
  # ?.lua - template for file searching
  # ;; - at the end adds standard lua paths
  lua_package_path "$prefix/src/?.lua;$prefix/?.lua;;";

  init_by_lua_block {
    require "lpeg"
  }

  server {
    listen ${{port}};
    lua_code_cache ${{code_cache}};

    location / {
      default_type text/html;
      content_by_lua_block {
        require("lapis").serve("src.app")
      }
    }

    location /static/ {
      alias static/;
    }

    location /favicon.ico {
      alias static/favicon.ico;
    }
  }
}
